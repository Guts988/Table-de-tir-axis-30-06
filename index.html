<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table de Tir — Savage Axis 30-06</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #ECF0F5; font-family: system-ui, -apple-system, sans-serif; }
    input[type=range] { height: 6px; }
    input[type=number] { font-family: system-ui; outline: none; }
    input[type=number]:focus { border-color: #1A2B5A !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo } = React;

// ═══════════════════════════════════════════════
//  BALISTIQUE — Savage Axis 30-06 / Perfecta 150gr
// ═══════════════════════════════════════════════
const V0   = 873;       // m/s
const K0   = 6.14e-4;  // constante traînée à 15°C (G1, BC 0.380)
const MASS = 9.72e-3;  // kg (150gr)
const HS   = 0.0485;   // m  (hauteur visée — Weaver High 1.2" + rail, voir note)
const Z0   = 25;       // m  (zéro 1)
const CLK  = 0.1;      // mrad/clic
const G    = 9.81;
const TREF = 288.15;   // K (15°C)
const DISTS = [25, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500];

const kT    = (tc) => K0 * TREF / (tc + 273.15);
const vel   = (x, k) => V0 * Math.exp(-k * x);
const tof   = (x, k) => (Math.exp(k * x) - 1) / (k * V0);
const alpha = (k)   => { const t = tof(Z0, k); return (HS + 0.5 * G * t * t) / Z0; };
const ecart = (x, k, a) => (-HS + a * x - 0.5 * G * tof(x, k) ** 2) * 100;
const derive = (x, k, wms) => wms * (tof(x, k) - x / V0) * 100;
const ekin  = (x, k) => Math.round(0.5 * MASS * vel(x, k) ** 2);

function buildTable(tc, wkh, wa) {
  const k   = kT(tc);
  const a   = alpha(k);
  const wms = (wkh / 3.6) * Math.abs(Math.sin(wa * Math.PI / 180));
  return DISTS.map((x) => {
    const ec = ecart(x, k, a);
    const mr = x === Z0 ? 0 : -ec / (0.1 * x);
    const mo = x === Z0 ? 0 : -ec / (0.02909 * x);
    return {
      x,
      v:  Math.round(vel(x, k)),
      ek: ekin(x, k),
      tf: tof(x, k).toFixed(3),
      ec: ec.toFixed(1),
      mr: mr.toFixed(2),
      mo: mo.toFixed(1),
      cl: Math.round(mr / CLK),
      dr: derive(x, k, wms).toFixed(1),
      wcl: wms === 0 ? 0 : Math.round(derive(x, k, wms) / (x * 0.01)),
      hi: ec > 0.3,
      lo: ec < -0.3,
    };
  });
}

function interpCorr(d, tbl) {
  if (d <= Z0) return { ec: "0.0", mo: "0.0", mr: "0.00", cl: 0 };
  const last = tbl[tbl.length - 1];
  if (d >= last.x) return { ec: last.ec, mo: last.mo, mr: last.mr, cl: last.cl };
  for (let i = 0; i < tbl.length - 1; i++) {
    if (tbl[i].x <= d && tbl[i + 1].x >= d) {
      const r  = (d - tbl[i].x) / (tbl[i + 1].x - tbl[i].x);
      const iv = (a, b) => parseFloat(a) + r * (parseFloat(b) - parseFloat(a));
      const mr = iv(tbl[i].mr, tbl[i + 1].mr);
      return {
        ec: iv(tbl[i].ec, tbl[i + 1].ec).toFixed(1),
        mo: iv(tbl[i].mo, tbl[i + 1].mo).toFixed(1),
        mr: mr.toFixed(2),
        cl: Math.round(mr / CLK),
      };
    }
  }
  return { ec: "?", mo: "?", mr: "?", cl: 0 };
}

// ═══════════════════════════════════════════════
//  HELPERS UI
// ═══════════════════════════════════════════════
const BG  = "#1A2B5A";
const BG2 = "#14203C";

const sgn = (n, dec = 1) => {
  const v = parseFloat(n);
  return (v > 0 ? "+" : "") + v.toFixed(dec);
};

const vCol = (n) => {
  const v = parseFloat(n);
  if (v >  0.05) return "#1A5276";
  if (v < -0.05) return "#C0392B";
  return "#1E8449";
};

const rowBg = (r) => (!r.hi && !r.lo ? "#C8F7D4" : r.hi ? "#FDECEA" : "#EAF4FC");

// ── Slider réutilisable ──────────────────────────────────────────
function Slider({ label, val, onChange, min, max, step = 1, disp, color }) {
  return (
    <div style={{ marginBottom: 22 }}>
      <div style={{ display: "flex", justifyContent: "space-between",
        fontWeight: "bold", color: BG, fontSize: 13, marginBottom: 6 }}>
        <span>{label}</span>
        <span style={{ fontSize: 20, color: color || BG }}>{disp}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={val}
        onChange={(e) => onChange(+e.target.value)}
        style={{ width: "100%", accentColor: BG, cursor: "pointer", height: 6 }} />
    </div>
  );
}

// ═══════════════════════════════════════════════
//  APP
// ═══════════════════════════════════════════════
function App() {
  const [tab,  setTab]  = useState(0);
  const [tc,   setTc]   = useState(15);
  const [wkh,  setWkh]  = useState(0);
  const [wa,   setWa]   = useState(90);
  const [lv,   setLv]   = useState("");
  const [ang,  setAng]  = useState("");
  const [ht,   setHt]   = useState("");
  const [mode, setMode] = useState("angle");
  const [dir,  setDir]  = useState("haut"); // "haut" = cible au-dessus, "bas" = cible en dessous

  const tbl = useMemo(() => buildTable(tc, wkh, wa), [tc, wkh, wa]);

  // 2e zéro
  const z2 = useMemo(() => {
    for (let i = 1; i < tbl.length - 1; i++) {
      const e1 = parseFloat(tbl[i].ec), e2 = parseFloat(tbl[i + 1].ec);
      if (e1 > 0 && e2 <= 0)
        return Math.round(tbl[i].x + (tbl[i + 1].x - tbl[i].x) * e1 / (e1 - e2));
    }
    return null;
  }, [tbl]);

  // Calculateur montagne
  const calc = useMemo(() => {
    const d = parseFloat(lv);
    if (!d || d <= 0) return null;
    let ad;
    if (mode === "angle") {
      ad = parseFloat(ang);
      if (isNaN(ad) || ad < 0 || ad >= 90) return null;
    } else {
      const h = parseFloat(ht);
      if (isNaN(h) || h <= 0 || h >= d) return null;
      ad = (Math.asin(h / d) * 180) / Math.PI;
    }
    const de = d * Math.cos((ad * Math.PI) / 180);
    return { ad: ad.toFixed(1), de: Math.round(de), ...interpCorr(de, tbl) };
  }, [lv, ang, ht, mode, tbl]);

  // ── RENDU ──────────────────────────────────────────────────────
  return (
    <div style={{ fontFamily: "system-ui, -apple-system, sans-serif",
      background: "#ECF0F5", minHeight: "100vh", maxWidth: 680, margin: "0 auto" }}>

      {/* ── HEADER ── */}
      <div style={{ background: BG, color: "white", padding: "14px 16px",
        borderBottom: "3px solid #0F1828" }}>
        <div style={{ fontWeight: "bold", fontSize: 13, letterSpacing: 0.8 }}>
          🎯 TABLE DE TIR — SAVAGE AXIS 30-06 SPRINGFIELD
        </div>
        <div style={{ fontSize: 11, opacity: 0.65, marginTop: 3 }}>
          Fiocchi Perfecta 150gr SP · V₀ 873 m/s · BC G1 0.380 · Zéro 25 m · 0.1 mrad/clic
        </div>
        <div style={{ fontSize: 10, opacity: 0.5, marginTop: 2 }}>
          ⚠️ HS 48.5mm estimée (colliers Weaver High 1.2") — à confirmer au stand
        </div>
      </div>

      {/* ── TABS ── */}
      <div style={{ display: "flex", background: BG2 }}>
        {["🎯 Table de tir", "⛰️ Montagne", "🌡️ Conditions"].map((l, i) => (
          <button key={i} onClick={() => setTab(i)} style={{
            flex: 1, padding: "11px 4px", cursor: "pointer", border: "none",
            background: tab === i ? "#253E78" : "transparent",
            color: tab === i ? "white" : "#7A9CC0",
            fontWeight: tab === i ? "bold" : "normal",
            fontSize: 12,
            borderBottom: tab === i ? "3px solid #4E8ED4" : "3px solid transparent",
            transition: "all .12s",
          }}>{l}</button>
        ))}
      </div>

      <div style={{ padding: "14px 10px 32px" }}>

        {/* ════════════════════════════════════════
            TAB 0 — TABLE DE TIR
            ════════════════════════════════════════ */}
        {tab === 0 && (
          <div>
            {/* Bandeau conditions */}
            <div style={{ background: "#E4EBF5", border: "1px solid #B8C8DC",
              borderRadius: 7, padding: "8px 12px", marginBottom: 12,
              display: "flex", flexWrap: "wrap", gap: 14,
              fontSize: 12, color: BG, alignItems: "center" }}>
              <span>🌡️ <b>{tc}°C</b></span>
              <span>💨 <b>{wkh} km/h</b> · {wa}°</span>
              {z2 && <span>📍 2e zéro ≈ <b style={{ color: "#1E8449" }}>{z2} m</b></span>}
              <span
                onClick={() => setTab(2)}
                style={{ marginLeft: "auto", fontSize: 11, opacity: 0.6,
                  cursor: "pointer", textDecoration: "underline" }}>
                ✏️ Modifier →
              </span>
            </div>

            {/* Table scrollable */}
            <div style={{ overflowX: "auto", borderRadius: 8,
              boxShadow: "0 2px 8px rgba(0,0,0,.14)" }}>
              <table style={{ width: "100%", borderCollapse: "collapse",
                fontSize: 11, minWidth: 400 }}>
                <thead>
                  <tr style={{ background: BG, color: "white" }}>
                    {["Dist.", "V (m/s)", "E (J)", "TOF (s)", "Écart (cm)",
                      "MOA", "mrad", "Clics ↕",
                      wkh > 0 ? "Dérive (cm)" : null,
                      wkh > 0 ? "Clics ↔" : null]
                      .filter(Boolean)
                      .map((h, i) => (
                        <th key={i} style={{
                          padding: "8px 5px",
                          textAlign: i === 0 ? "left" : "right",
                          fontSize: 10, whiteSpace: "nowrap",
                          position: i === 0 ? "sticky" : "static",
                          left: 0, background: BG, zIndex: 2,
                        }}>{h}</th>
                      ))}
                  </tr>
                </thead>
                <tbody>
                  {tbl.map((r, i) => (
                    <tr key={i} style={{ background: rowBg(r),
                      borderBottom: "1px solid rgba(0,0,0,.06)" }}>
                      {/* Distance — sticky */}
                      <td style={{ padding: "7px 8px", fontWeight: "bold",
                        color: BG, whiteSpace: "nowrap",
                        position: "sticky", left: 0, background: rowBg(r), zIndex: 1 }}>
                        {r.x} m
                        {!r.hi && !r.lo && (
                          <span style={{ color: "#1E8449", marginLeft: 4, fontSize: 10 }}>●</span>
                        )}
                      </td>
                      <td style={{ padding: "7px 5px", textAlign: "right" }}>{r.v}</td>
                      <td style={{ padding: "7px 5px", textAlign: "right" }}>{r.ek}</td>
                      <td style={{ padding: "7px 5px", textAlign: "right" }}>{r.tf}</td>
                      {/* Écart */}
                      <td style={{ padding: "7px 5px", textAlign: "right",
                        fontWeight: "bold", color: vCol(r.ec) }}>
                        {r.x === Z0 ? "0" : sgn(r.ec)}
                      </td>
                      {/* MOA */}
                      <td style={{ padding: "7px 5px", textAlign: "right", color: vCol(r.mo) }}>
                        {r.x === Z0 ? "0.0" : sgn(r.mo)}
                      </td>
                      {/* mrad */}
                      <td style={{ padding: "7px 5px", textAlign: "right", color: vCol(r.mr) }}>
                        {r.x === Z0 ? "0.00" : sgn(r.mr, 2)}
                      </td>
                      {/* Clics */}
                      <td style={{ padding: "7px 5px", textAlign: "right",
                        fontWeight: "bold", color: vCol(r.cl) }}>
                        {r.cl > 0 ? "+" : ""}{r.cl}
                      </td>
                      {/* Dérive cm */}
                      {wkh > 0 && (
                        <td style={{ padding: "7px 5px", textAlign: "right" }}>
                          {parseFloat(r.dr) > 0 ? "+" : ""}{r.dr}
                        </td>
                      )}
                      {/* Clics dérive ↔ */}
                      {wkh > 0 && (
                        <td style={{ padding: "7px 5px", textAlign: "right",
                          fontWeight: "bold",
                          color: r.wcl > 0 ? "#6C3483" : "#555" }}>
                          {r.wcl > 0 ? "+" : ""}{r.wcl}
                        </td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>

            {/* Légende */}
            <div style={{ marginTop: 10, display: "flex", flexWrap: "wrap",
              gap: "6px 14px", fontSize: 11, color: "#555" }}>
              {[
                ["#FDECEA", "Rouge : balle trop haute → clic –"],
                ["#EAF4FC", "Bleu : balle trop basse → clic +"],
                ["#C8F7D4", "Vert ● : zéro"],
              ].map(([bg, txt]) => (
                <span key={txt} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                  <span style={{ background: bg, padding: "2px 8px",
                    borderRadius: 3, fontSize: 10, border: "1px solid rgba(0,0,0,.08)" }} />
                  {txt}
                </span>
              ))}
              {wkh > 0 && (
                <span style={{ fontSize: 11, color: "#6C3483", marginTop: 2 }}>
                  ↕ Élévation · ↔ Dérive (sens opposé au vent)
                </span>
              )}
            </div>
          </div>
        )}

        {/* ════════════════════════════════════════
            TAB 1 — CALCULATEUR MONTAGNE
            ════════════════════════════════════════ */}
        {tab === 1 && (
          <div style={{ maxWidth: 440 }}>
            <h3 style={{ color: BG, margin: "0 0 14px", fontSize: 15 }}>
              ⛰️ Calculateur déclive montagne
            </h3>

            {/* Toggle direction HAUT / BAS */}
            <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
              {[["haut", "⬆️ Cible plus haute"], ["bas", "⬇️ Cible plus basse"]].map(([d, l]) => (
                <button key={d} onClick={() => setDir(d)} style={{
                  flex: 1, padding: "9px 6px", borderRadius: 7, border: "none",
                  cursor: "pointer", fontSize: 13,
                  background: dir === d
                    ? (d === "haut" ? "#1A5276" : "#922B21")
                    : "#D4DCE8",
                  color: dir === d ? "white" : "#444",
                  fontWeight: dir === d ? "bold" : "normal",
                }}>{l}</button>
              ))}
            </div>

            {/* Schéma SVG — s'adapte à la direction */}
            {dir === "haut" ? (
              // Cible PLUS HAUTE que le tireur (tir montant)
              <svg width="100%" viewBox="0 0 300 110"
                style={{ display: "block", marginBottom: 14,
                  background: "#F4F7FB", borderRadius: 8, border: "1px solid #C8D4E4" }}>
                <line x1="18" y1="90" x2="282" y2="90" stroke="#D0D8E4" strokeWidth="1.5" />
                <line x1="22" y1="90" x2="230" y2="90" stroke="#1A5276" strokeWidth="3" />
                <text x="126" y="106" fontSize="10" textAnchor="middle"
                  fill="#1A5276" fontWeight="bold">D_eff = D_LV × cos(α)</text>
                <line x1="230" y1="24" x2="230" y2="90" stroke="#C0392B"
                  strokeWidth="2.5" strokeDasharray="6,3" />
                <text x="246" y="60" fontSize="10" fill="#C0392B" fontWeight="bold">Δh</text>
                <line x1="22" y1="90" x2="230" y2="24" stroke={BG} strokeWidth="2.5" />
                <text x="115" y="47" fontSize="9.5" textAnchor="middle" fill={BG}>D_LV (télémètre)</text>
                <path d="M62,90 A40,40 0 0,0 58,72" fill="none" stroke="#E67E22" strokeWidth="2" />
                <text x="75" y="77" fontSize="12" fill="#E67E22" fontWeight="bold">α</text>
                <circle cx="22" cy="90" r="6" fill={BG} />
                <text x="22" y="81" fontSize="8.5" textAnchor="middle" fill={BG}>Tireur</text>
                <circle cx="230" cy="24" r="6" fill="#C0392B" />
                <text x="230" y="15" fontSize="8.5" textAnchor="middle" fill="#C0392B">Cible</text>
              </svg>
            ) : (
              // Cible PLUS BASSE que le tireur (tir descendant — cabane, falaise...)
              <svg width="100%" viewBox="0 0 300 110"
                style={{ display: "block", marginBottom: 14,
                  background: "#FDF4F3", borderRadius: 8, border: "1px solid #E8C4C0" }}>
                <line x1="18" y1="20" x2="282" y2="20" stroke="#D0D8E4" strokeWidth="1.5" />
                {/* D_eff horizontal bas */}
                <line x1="22" y1="86" x2="230" y2="86" stroke="#1A5276" strokeWidth="3" />
                <text x="126" y="100" fontSize="10" textAnchor="middle"
                  fill="#1A5276" fontWeight="bold">D_eff = D_LV × cos(α)</text>
                {/* Δh vertical */}
                <line x1="230" y1="20" x2="230" y2="86" stroke="#C0392B"
                  strokeWidth="2.5" strokeDasharray="6,3" />
                <text x="246" y="56" fontSize="10" fill="#C0392B" fontWeight="bold">Δh</text>
                {/* D_LV diagonal descendant */}
                <line x1="22" y1="20" x2="230" y2="86" stroke={BG} strokeWidth="2.5" />
                <text x="115" y="43" fontSize="9.5" textAnchor="middle" fill={BG}>D_LV (télémètre)</text>
                {/* Arc angle */}
                <path d="M62,20 A40,40 0 0,1 58,38" fill="none" stroke="#E67E22" strokeWidth="2" />
                <text x="75" y="48" fontSize="12" fill="#E67E22" fontWeight="bold">α</text>
                {/* Tireur en HAUT */}
                <circle cx="22" cy="20" r="6" fill={BG} />
                <text x="22" y="12" fontSize="8.5" textAnchor="middle" fill={BG}>Tireur</text>
                {/* Cible en BAS */}
                <circle cx="230" cy="86" r="6" fill="#C0392B" />
                <text x="230" y="100" fontSize="8.5" textAnchor="middle" fill="#C0392B">Cible</text>
              </svg>
            )}

            {/* Sélecteur de mode */}
            <div style={{ display: "flex", gap: 8, marginBottom: 16 }}>
              {[["angle", "📐 Distance + Angle"],
                ["hauteur", "📏 Distance + Hauteur"]].map(([m, l]) => (
                <button key={m} onClick={() => setMode(m)} style={{
                  flex: 1, padding: "9px 6px", borderRadius: 7, border: "none",
                  cursor: "pointer", fontSize: 12,
                  background: mode === m ? BG : "#D4DCE8",
                  color: mode === m ? "white" : "#444",
                  fontWeight: mode === m ? "bold" : "normal",
                }}>{l}</button>
              ))}
            </div>

            {/* Inputs */}
            <div style={{ display: "flex", flexDirection: "column", gap: 12, marginBottom: 16 }}>
              <div>
                <label style={{ fontSize: 12, fontWeight: "bold", color: "#444",
                  display: "block", marginBottom: 5 }}>
                  Distance télémètre — D_LV (mètres)
                </label>
                <input type="number" value={lv}
                  onChange={(e) => setLv(e.target.value)}
                  placeholder="ex : 380" min="1"
                  style={{ width: "100%", padding: "11px 13px",
                    border: "1.5px solid #B4C4D8", borderRadius: 7,
                    fontSize: 17, boxSizing: "border-box",
                    fontFamily: "system-ui", outline: "none" }} />
              </div>
              <div>
                <label style={{ fontSize: 12, fontWeight: "bold", color: "#444",
                  display: "block", marginBottom: 5 }}>
                  {mode === "angle"
                    ? "Angle α par rapport à l'horizontale (degrés)"
                    : "Différence de hauteur Δh entre tireur et cible (mètres)"}
                </label>
                <input type="number"
                  value={mode === "angle" ? ang : ht}
                  onChange={(e) => mode === "angle"
                    ? setAng(e.target.value)
                    : setHt(e.target.value)}
                  placeholder={mode === "angle" ? "ex : 23" : "ex : 120"}
                  min="0"
                  style={{ width: "100%", padding: "11px 13px",
                    border: "1.5px solid #B4C4D8", borderRadius: 7,
                    fontSize: 17, boxSizing: "border-box",
                    fontFamily: "system-ui", outline: "none" }} />
              </div>
            </div>

            {/* Résultat */}
            {calc ? (
              <div style={{
                background: dir === "haut" ? BG : "#7B241C",
                color: "white", borderRadius: 10,
                padding: 18, boxShadow: "0 4px 14px rgba(0,0,0,.25)" }}>
                <div style={{ fontSize: 12, opacity: 0.75, marginBottom: 12,
                  borderBottom: "1px solid rgba(255,255,255,.2)", paddingBottom: 10 }}>
                  {dir === "haut" ? "⬆️ Tir montant" : "⬇️ Tir descendant"}
                  &nbsp;·&nbsp; Angle : <b>{calc.ad}°</b>
                  &nbsp;·&nbsp; D_eff : <b>{calc.de} m</b>
                  &nbsp;·&nbsp; {tc}°C · {wkh} km/h
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr 1fr",
                  gap: 8, textAlign: "center" }}>
                  {[
                    [calc.cl > 0 ? "+" + calc.cl : String(calc.cl), "CLICS",   "#FFD54F", 26],
                    [(parseFloat(calc.mr) >= 0 ? "+" : "") + calc.mr, "mrad",  "white",   20],
                    [(parseFloat(calc.mo) >= 0 ? "+" : "") + calc.mo, "MOA",   "white",   20],
                    [(parseFloat(calc.ec) >= 0 ? "+" : "") + calc.ec + " cm", "Écart",
                      "rgba(255,255,255,.75)", 15],
                  ].map(([v, l, c, fs]) => (
                    <div key={l} style={{ background: "rgba(255,255,255,.1)",
                      borderRadius: 7, padding: "10px 4px" }}>
                      <div style={{ fontSize: fs, fontWeight: "bold", color: c }}>{v}</div>
                      <div style={{ fontSize: 10, opacity: 0.65, marginTop: 3 }}>{l}</div>
                    </div>
                  ))}
                </div>
              </div>
            ) : lv ? (
              <div style={{ padding: 12, background: "#FFF8E1", borderRadius: 7,
                fontSize: 12, color: "#856404", border: "1px solid #F0D06C" }}>
                ⚠️ Valeurs invalides — vérifier que Δh &lt; D_LV et angle &lt; 90°
              </div>
            ) : null}

            {/* Note */}
            <div style={{ marginTop: 14, padding: 11, background: "#E8EEF7",
              borderRadius: 7, fontSize: 12, color: "#444",
              border: "1px solid #C4D0E0", lineHeight: 1.6 }}>
              <b>Rappel :</b> La formule D_eff = D_LV × cos(α) est identique en tir montant
              et descendant — seule la distance horizontale compte pour la balistique.
              Correction significative au-delà de ~15° (Δh ≈ 27% de D_LV).
            </div>
          </div>
        )}

        {/* ════════════════════════════════════════
            TAB 2 — CONDITIONS
            ════════════════════════════════════════ */}
        {tab === 2 && (
          <div style={{ maxWidth: 440 }}>
            <h3 style={{ color: BG, margin: "0 0 18px", fontSize: 15 }}>
              🌡️ Conditions atmosphériques
            </h3>

            <Slider
              label="🌡️ Température"
              val={tc} onChange={setTc}
              min={-20} max={40}
              disp={`${tc}°C`}
              color={tc < 0 ? "#2980B9" : tc > 30 ? "#E74C3C" : "#27AE60"}
            />
            <div style={{ display: "flex", justifyContent: "space-between",
              fontSize: 10, color: "#999", marginTop: -18, marginBottom: 22 }}>
              <span>-20°C</span><span>0°C</span><span>15°C std</span><span>+40°C</span>
            </div>

            <Slider
              label="💨 Vitesse du vent"
              val={wkh} onChange={setWkh}
              min={0} max={80}
              disp={`${wkh} km/h`}
              color={wkh === 0 ? "#27AE60" : wkh > 40 ? "#E74C3C" : "#E67E22"}
            />
            <div style={{ display: "flex", justifyContent: "space-between",
              fontSize: 10, color: "#999", marginTop: -18, marginBottom: 22 }}>
              <span>Calme</span><span>Brise 10</span><span>Modéré 30</span><span>Fort 80</span>
            </div>

            <div style={{ marginBottom: 22 }}>
              <div style={{ display: "flex", justifyContent: "space-between",
                fontWeight: "bold", color: BG, fontSize: 13, marginBottom: 6 }}>
                <span>🧭 Direction du vent / trajectoire</span>
                <span style={{ fontSize: 16 }}>
                  {wa === 0 || wa === 180
                    ? "Face / Dos"
                    : wa === 90 ? "Traversier ⊥" : `${wa}°`}
                </span>
              </div>
              <input type="range" min={0} max={180} step={5} value={wa}
                onChange={(e) => setWa(+e.target.value)}
                style={{ width: "100%", accentColor: BG, cursor: "pointer", height: 6 }} />
              <div style={{ display: "flex", justifyContent: "space-between",
                fontSize: 10, color: "#999", marginTop: 5 }}>
                <span>0° face/dos</span><span>45°</span><span>90° plein travers</span>
              </div>
              <div style={{ marginTop: 10, fontSize: 12, color: "#555",
                background: "#E8EEF7", padding: "7px 11px", borderRadius: 6 }}>
                Composante transversale effective :{" "}
                <b style={{ color: BG }}>
                  {Math.round(wkh * Math.abs(Math.sin((wa * Math.PI) / 180)))} km/h
                </b>
              </div>
            </div>

            {/* Effets calculés */}
            {(() => {
              const std  = buildTable(15, 0, 90);
              const get  = (x) => ({
                s: std.find((r) => r.x === x),
                c: tbl.find((r) => r.x === x),
              });
              const { s: s3, c: c3 } = get(300);
              const { s: s5, c: c5 } = get(500);
              const dE3  = (parseFloat(c3.ec) - parseFloat(s3.ec)).toFixed(1);
              const dE5  = (parseFloat(c5.ec) - parseFloat(s5.ec)).toFixed(1);
              const dCl3 = c3.cl - s3.cl;
              const dCl5 = c5.cl - s5.cl;
              const dr3  = parseFloat(c3.dr).toFixed(1);
              const dr5  = parseFloat(c5.dr).toFixed(1);

              return (
                <div style={{ background: BG, color: "white",
                  borderRadius: 10, padding: 16 }}>
                  <div style={{ fontWeight: "bold", marginBottom: 12, fontSize: 13 }}>
                    Effets à 300 m et 500 m — vs conditions standard :
                  </div>
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                    {[
                      ["📐 Élév. 300 m",
                        `${parseFloat(dE3) > 0 ? "+" : ""}${dE3} cm`],
                      ["📐 Élév. 500 m",
                        `${parseFloat(dE5) > 0 ? "+" : ""}${dE5} cm`],
                      ["💨 Dérive 300 m", `${dr3} cm`],
                      ["💨 Dérive 500 m", `${dr5} cm`],
                      ["🔧 Δ clics 300 m",
                        `${dCl3 > 0 ? "+" : ""}${dCl3} clic${Math.abs(dCl3) !== 1 ? "s" : ""}`],
                      ["🔧 Δ clics 500 m",
                        `${dCl5 > 0 ? "+" : ""}${dCl5} clic${Math.abs(dCl5) !== 1 ? "s" : ""}`],
                    ].map(([l, v]) => (
                      <div key={l} style={{ background: "rgba(255,255,255,.1)",
                        borderRadius: 7, padding: "9px 11px" }}>
                        <div style={{ fontSize: 10, opacity: 0.7 }}>{l}</div>
                        <div style={{ fontSize: 19, fontWeight: "bold", marginTop: 2 }}>{v}</div>
                      </div>
                    ))}
                  </div>
                  <div style={{ marginTop: 10, fontSize: 10, opacity: 0.55,
                    borderTop: "1px solid rgba(255,255,255,.15)", paddingTop: 8 }}>
                    Élév. + = balle plus haute (air moins dense, moins de chute)<br />
                    Les modifications s'appliquent en temps réel à la table de tir
                  </div>
                </div>
              );
            })()}

            <button
              onClick={() => { setTc(15); setWkh(0); setWa(90); }}
              style={{ marginTop: 14, width: "100%", padding: 11,
                background: "#CDD6E2", border: "none", borderRadius: 7,
                cursor: "pointer", fontSize: 13, fontWeight: "bold", color: "#333" }}>
              ↺ Réinitialiser — conditions standard (15°C, vent nul)
            </button>
          </div>
        )}

      </div>
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
